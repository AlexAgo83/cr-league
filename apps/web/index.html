<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; worker-src 'self' blob:; base-uri 'self'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121014" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>CR League</title>
    <meta name="description" content="Create a private Grand Prix league. Run the team. Watch the race answer your decisions." />
    <!-- Leagues are shared by link, so every invite renders a card instead of a bare URL.
         og-card.png is served with an immutable cache header: bump ?v when regenerating it. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CR League" />
    <meta property="og:title" content="CR League" />
    <meta property="og:description" content="Create a private Grand Prix league. Run the team. Watch the race answer your decisions." />
    <meta property="og:url" content="https://cr-league.onrender.com" />
    <meta property="og:image" content="https://cr-league.onrender.com/assets/social/og-card.png?v=1" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="CR League race screen: a city circuit map with the final classification and the current race plan." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
