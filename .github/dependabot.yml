version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      non-major:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: prisma
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: "@eslint/js"
        update-types:
          - version-update:semver-major
      # A Playwright major broke every e2e lane once already: project references stopped accepting a
      # directory and had to name their tsconfig.json. TypeScript majors land the same way, across
      # every workspace at once. Both are migrations, not updates — raise them deliberately.
      - dependency-name: "@playwright/test"
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      non-major:
        update-types:
          - minor
          - patch
